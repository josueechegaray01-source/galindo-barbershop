<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="GALINDO BARBERSHOP - Reserva tu cita, conoce nuestros servicios y barberos. Barbería premium en Perú.">
  <meta name="theme-color" content="#171717">

  <!-- Open Graph -->
  <meta property="og:title" content="GALINDO BARBERSHOP">
  <meta property="og:description" content="Reserva tu cita en Galindo Barbershop. Estilo, precisión y actitud.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Galindo Barbershop">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GALINDO BARBERSHOP</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #171717;
      color: #F4F4F4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: radial-gradient(circle at 50% 40%, #242424 0%, #171717 70%);
      z-index: 9999;
      transition: opacity 300ms ease;
    }
    #loading img {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(212, 168, 67, 0.25);
    }
    #loading .brand {
      font-size: 18px;
      letter-spacing: 4px;
      font-weight: 600;
      color: #D4A843;
    }
    #loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(212, 168, 67, 0.2);
      border-top-color: #D4A843;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="Galindo Barbershop">
    <div class="brand">GALINDO</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 320);
    });
  </script>
</body>
</html>
