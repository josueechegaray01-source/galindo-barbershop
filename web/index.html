  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #171717; color: #F4F4F4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    #app { min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .loader { width: 40px; height: 40px; border: 4px solid rgba(212, 168, 67, 0.2); border-top-color: #D4A843; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="loader"></div>
    <p style="margin-top: 20px; text-align: center;">Cargando...</p>
  </div>

  <!-- flutter_bootstrap.js hace TODO: setea buildConfig, carga service worker, y llama a loader.load() -->
  <!-- IMPORTANTE: cargar como script regular (NO module) porque es un IIFE -->
  <script src="/flutter_bootstrap.js"></script>

  <script>
    // Ocultar loader cuando Flutter termine de cargar
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('app');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 320);
      }
    });
  </script>
</body>
